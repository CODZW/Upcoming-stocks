<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Stocks — Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(at top, #1e111a 0%, #0f0a0d 100%);
        }
        .bg-maroon-deep { background-color: #4a152d; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col antialiased pb-12">

    <!-- Premium Navigation / Header -->
    <header class="border-b border-white/5 bg-black/35 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-700 to-[#7b2c52] flex items-center justify-center shadow-lg shadow-rose-950/40">
                    <span class="font-extrabold text-white text-lg tracking-wide">US</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-100 to-gray-400 bg-clip-text text-transparent">UPCOMING STOCKS</h1>
                    <p class="text-xs text-gray-500 font-medium">Enterprise Portfolio Manager</p>
                </div>
            </div>
            <button onclick="toggleModal('settingsModal')" class="bg-white/5 border border-white/10 hover:border-white/20 text-gray-200 px-4 py-2 rounded-xl text-sm font-semibold inline-flex items-center gap-2 transition duration-200 hover:bg-white/10">
                <span>⚙️</span> Manage Dropdowns
            </button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-6 mt-8 flex-1 flex flex-col">
        
        <!-- Action Hub & Filters -->
        <div class="bg-[#1a1518] border border-white/5 rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="openAddModal()" class="bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 transition shadow-lg shadow-emerald-950/20">
                    <span class="text-lg">+</span> Add New Stock
                </button>
                <div class="h-6 w-px bg-white/10 hidden sm:block"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Seller</span>
                    <select id="filterSeller" onchange="renderTable()" class="bg-white/5 border border-white/10 text-gray-300 text-sm rounded-lg p-2 focus:ring-1 focus:ring-pink-500 outline-none w-44">
                        <option value="All" class="bg-neutral-900">All Sellers</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Country</span>
                    <select id="filterCountry" onchange="renderTable()" class="bg-white/5 border border-white/10 text-gray-300 text-sm rounded-lg p-2 focus:ring-1 focus:ring-pink-500 outline-none w-32">
                        <option value="All" class="bg-neutral-900">All</option>
                        <option value="KSA"
