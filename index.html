<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120e10">
<title>Upcoming Stocks — Portfolio Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#120e10;font-family:ui-sans-serif,system-ui,sans-serif}
  .bg-maroon{background:#7b2c52}.text-maroon{color:#d46596}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:60;align-items:center;justify-content:center;padding:1rem}
  .field{background:#1f2937;border:1px solid #374151;border-radius:.5rem;padding:.65rem .75rem;width:100%;color:#f3f4f6;outline:none}
  .field:focus{border-color:#d46596;box-shadow:0 0 0 2px rgba(212,101,150,.15)}
  .btn{border-radius:.5rem;padding:.6rem .9rem;font-size:.875rem;font-weight:650;transition:.15s}
  .kpi{background:#111827;border:1px solid #293241;border-radius:.85rem;padding:1rem}
  .kpi-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;font-weight:700}
  .kpi-value{font-size:1.65rem;font-weight:800;color:#fff;margin-top:.25rem}
  .badge{display:inline-block;padding:.25rem .55rem;border-radius:.4rem;font-size:.72rem;font-weight:750;border:1px solid}
  .table-wrap{overflow:auto}
  th{position:sticky;top:0;background:#09090b;z-index:2}
  input[type=date],input[type=number]{color-scheme:dark}
  .muted{color:#9ca3af}
  @media(max-width:640px){main{padding:1rem!important}.kpi-value{font-size:1.35rem}}
</style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col antialiased">
<header class="border-b border-gray-800 bg-[#0a0809] p-4 sticky top-0 z-40">
 <div class="max-w-[1600px] mx-auto flex flex-wrap justify-between items-center gap-3">
  <div class="flex items-center gap-3">
   <div class="w-10 h-10 rounded-lg bg-maroon flex items-center justify-center font-bold text-white">US</div>
   <div><h1 class="text-xl font-bold text-white tracking-wide">UPCOMING STOCKS</h1><p class="text-xs text-gray-400">Personal Portfolio Manager · Data stays in this browser</p></div>
  </div>
  <div class="flex flex-wrap gap-2">
   <button class="btn bg-blue-700 hover:bg-blue-600 text-white" onclick="exportToCSV()">↓ Export CSV</button>
   <input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(event)">
   <button class="btn bg-gray-800 hover:bg-gray-700 text-white" onclick="toggleModal('settingsModal')">⚙️ Manage Dropdowns</button>
  </div>
 </div>
</header>
<main class="max-w-[1600px] w-full mx-auto p-6 flex flex-col gap-5 flex-1">
 <section class="grid grid-cols-2 lg:grid-cols-5 gap-3" aria-label="Portfolio summary">
  <div class="kpi"><div class="kpi-label">Total records</div><div id="kpiRecords" class="kpi-value">0</div></div>
  <div class="kpi"><div class="kpi-label">Requested quantity</div><div id="kpiRequested" class="kpi-value">0</div></div>
  <div class="kpi"><div class="kpi-label">Delivered quantity</div>
